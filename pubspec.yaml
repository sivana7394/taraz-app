name: taraz
description: "تراز — حسابداری مشارکت ساخت‌وساز (دو طرف، ۳ دانگ / ۳ دانگ)"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # داده و همگام‌سازی (نسخه‌ها در CI به آخرین نسخهٔ سازگار حل می‌شوند)
  firebase_core: any
  cloud_firestore: any

  # وضعیت و ذخیرهٔ محلی
  provider: any
  shared_preferences: any
  crypto: any

  # تاریخ شمسی
  shamsi_date: any

  # رسید: گرفتن عکس و کوچک‌سازی
  image_picker: any
  image: any

  # خروجی و اشتراک‌گذاری
  share_plus: any
  path_provider: any
  pdf: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt
    - assets/icon/icon.png

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 23
